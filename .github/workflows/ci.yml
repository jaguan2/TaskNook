name: CI

on:
  push:
    # Dev work is covered by its pull request. Running again for the branch
    # push duplicated the complete five-job suite for every PR update.
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer commit makes an in-flight run for the same branch or PR obsolete.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest tests -q

  # Guards the schema promise: models and migrations must not drift apart.
  # Without this, a forgotten migration only surfaces as a broken upgrade on a
  # user's machine.
  migrations-in-sync:
    name: Migrations match models
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fail if models have changes with no migration
        env:
          FLASK_APP: app.py
          TASKNOOK_DB: /tmp/ci-check.db
        run: |
          flask db upgrade
          flask db check

  browser-smoke:
    name: Production browser smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm ci
        working-directory: e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - run: pip install -r backend/requirements.txt
      - run: npm test
        working-directory: e2e
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-smoke-failure
          path: e2e/test-results
          retention-days: 7

  # The one that matters most. `npm run build` and `import app` can both pass
  # while the packaged .exe is completely broken: backend/ ships as loose data,
  # so PyInstaller can't see its imports, and --windowed means a missing one
  # fails silently with no console. Only running the real artifact proves it.
  windows-exe:
    name: Windows .exe smoke test
    runs-on: windows-latest
    env:
      ARTIFACT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: pip install -r requirements-desktop-build.txt
      - name: Verify the committed download before replacing it
        run: python scripts/desktop_package.py verify --base "$env:ARTIFACT_BASE_SHA"
      - name: Run the committed exe's self-test
        shell: pwsh
        env:
          TASKNOOK_SELFTEST: "1"
          PORT: "5098"
        run: |
          $p = Start-Process ".\TaskNook.exe" -PassThru
          if (-not $p.WaitForExit(180000)) {
            $p.Kill(); throw "Committed TaskNook.exe hung (likely an error dialog)."
          }
          if ($p.ExitCode -ne 0) { throw "Committed TaskNook.exe failed: exit $($p.ExitCode)" }
          Write-Host "committed exe self-test passed"
      - name: Build a fresh TaskNook.exe from the shared package definition
        run: python scripts/desktop_package.py build
      - name: Verify the fresh package and published manifest
        run: python scripts/desktop_package.py verify
      - name: Run the fresh exe's self-test (boots server + migrations, no window)
        shell: pwsh
        env:
          TASKNOOK_SELFTEST: "1"
          PORT: "5099"
        run: |
          $p = Start-Process ".\TaskNook.exe" -PassThru
          if (-not $p.WaitForExit(180000)) {
            $p.Kill(); throw "TaskNook.exe hung (likely an error dialog)."
          }
          if ($p.ExitCode -ne 0) { throw "TaskNook.exe failed: exit $($p.ExitCode)" }
          Write-Host "exe self-test passed"
