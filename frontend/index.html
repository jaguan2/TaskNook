<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%A1%3C/text%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600&family=Quicksand:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>TaskNook · a cozy place to get things done</title>
    <script>
      // Set BEFORE first paint, or reduced-motion users see a flash of the
      // very movement they asked not to see. Storage is wrapped separately so
      // that if it throws (disabled/partitioned), the OS preference still
      // applies — failing closed is the safe direction for this one.
      (function () {
        var mode = "auto";
        try {
          mode = localStorage.getItem("tasknook.motion") || "auto";
        } catch (e) {
          /* storage unavailable — fall through to the system preference */
        }
        var reduce =
          mode === "reduced" ||
          (mode !== "full" &&
            window.matchMedia("(prefers-reduced-motion: reduce)").matches);
        if (reduce) document.documentElement.setAttribute("data-motion", "reduced");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
